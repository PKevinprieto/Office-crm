<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CRM WhatsApp</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="crm">
      <aside class="sidebar">
        <header class="sidebar-header">
          <button
            id="themeToggle"
            class="theme-toggle"
            type="button"
            title="Cambiar tema"
          >
            ☀️
          </button>

          <h1 class="mobile-title">Office CRM</h1>

          <button class="menu-button" type="button">⋮</button>
        </header>

        <div class="search-container">
          <input id="search" type="search" placeholder="Buscar conversación" />
        </div>

        <section id="conversation-list" class="conversation-list"></section>
      </aside>

      <section class="chat">
        <div id="empty-chat" class="empty-chat">
          <div class="empty-chat-content">
            <h1>Office</h1>
            <p>Seleccioná una conversación</p>
            <span>para comenzar a chatear</span>
          </div>
        </div>
        <div id="active-chat" class="active-chat">
          <header class="chat-header">
            <button
              id="mobileBackButton"
              class="mobile-back-button"
              type="button"
              aria-label="Volver"
            >
              <svg
                viewBox="0 0 24 24"
                width="26"
                height="26"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M15 18l-6-6 6-6" />
              </svg>
            </button>
            <div class="avatar"></div>
            <div class="contact-data">
              <div class="contact-name-row">
                <strong id="contact-name"></strong>

                <button
                  id="edit-contact-button"
                  class="edit-contact-button"
                  type="button"
                  title="Editar contacto"
                >
                  ✎
                </button>
              </div>

              <span id="contact-number"></span>
            </div>
          </header>

          <section id="messages" class="messages"></section>

          <form id="message-form" class="message-form">
            <input
              id="imageInput"
              type="file"
              accept="image/jpeg,image/png,video/mp4,video/quicktime"
              hidden
            />

            <button
              id="attachImageButton"
              type="button"
              class="attach-image-button"
              title="Enviar imagen"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-paperclip"
              >
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path
                  d="M15 7l-6.5 6.5a1.5 1.5 0 0 0 3 3l6.5 -6.5a3 3 0 0 0 -6 -6l-6.5 6.5a4.5 4.5 0 0 0 9 9l6.5 -6.5"
                />
              </svg>
            </button>
            <!-- BOTÓN EMOJIS -->
            <div class="emoji-container">
              <button
                id="emojiButton"
                class="emoji-button"
                type="button"
                title="Emojis"
              >
                ☺
              </button>

              <div id="emojiPicker" class="emoji-picker" hidden>
                <div class="emoji-picker-header">
                  <strong>Emojis</strong>
                </div>

                <div id="emojiGrid" class="emoji-grid"></div>
              </div>
            </div>
            <textarea
              class="message-input"
              id="message-input"
              placeholder="Escribí un mensaje"
              rows="1"
            ></textarea>

            <div
              id="audioRecordingStatus"
              class="audio-recording-status"
              hidden
            >
              <button
                id="cancelAudioRecording"
                class="cancel-audio-recording"
                type="button"
                title="Eliminar grabación"
              >
                🗑️
              </button>

              <span class="recording-dot"></span>

              <span>Grabando</span>

              <span id="audioRecordingTime"> 0:00 </span>
            </div>

            <button
              id="messageActionButton"
              class="message-action-button"
              type="submit"
              title="Grabar audio"
            >
              <span id="messageActionContent">
                <!-- MICRÓFONO -->
                <svg
                  id="microphoneIcon"
                  class="action-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  width="22"
                  height="22"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"
                  />
                  <path d="M5 10v2a7 7 0 0 0 14 0v-2" />
                  <path d="M12 19v3" />
                </svg>

                <!-- ENVIAR -->
                <svg
                  id="sendIcon"
                  class="action-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  width="22"
                  height="22"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M5 12h14" />
                  <path d="m13 6 6 6-6 6" />
                </svg>
              </span>
            </button>
          </form>
        </div>
      </section>
    </main>
    <div id="imageViewer" class="image-viewer">
      <button id="closeImageViewer" class="image-viewer-close">&times;</button>
      <img id="imageViewerImg" src="" alt="Imagen ampliada" />
    </div>
    <div id="contactModal" class="contact-modal">
      <div class="contact-modal-content">
        <h2>Editar contacto</h2>

        <label for="contactNameInput"> Nombre </label>

        <input id="contactNameInput" type="text" autocomplete="off" />

        <div class="contact-modal-actions">
          <button id="cancelContactEdit" type="button">Cancelar</button>

          <button id="saveContactEdit" type="button">Guardar</button>
        </div>
      </div>
    </div>

    <!-- EDITOR DE CAPTURAS -->
    <div id="screenshotEditor" class="screenshot-editor">
      <div class="screenshot-editor-content">
        <div class="screenshot-editor-header">
          <strong>Editar captura</strong>

          <button id="closeScreenshotEditor" type="button" title="Cancelar">
            ×
          </button>
        </div>

        <div class="screenshot-canvas-container">
          <canvas id="screenshotCanvas"></canvas>
        </div>

        <div class="screenshot-editor-footer">
          <button
            id="clearScreenshotDrawing"
            type="button"
            class="screenshot-secondary-button"
          >
            Borrar dibujo
          </button>

          <div class="screenshot-editor-actions">
            <button
              id="cancelScreenshot"
              type="button"
              class="screenshot-secondary-button"
            >
              Cancelar
            </button>

            <button
              id="sendScreenshot"
              type="button"
              class="screenshot-send-button"
            >
              Enviar
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="mobile-bridge.js"></script>
    <script src="app.js"></script>
  </body>
</html>
